[package]
name = "cosmic-ext-applet-grok-monitor"
version = "0.4.5"
edition = "2024"
rust-version = "1.88"
license = "Unlicense"
description = "COSMIC panel applets that show shared Grok usage per account and xAI API prepaid credit"
repository = "https://github.com/simple-systems-se/grok-mon"
readme = "README.md"

[profile.release]
lto = "thin"
opt-level = 3

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", default-features = false, features = ["macros", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.1", features = ["alloc"] }

[dev-dependencies]
ron = "0.12.3"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "b812c77438e7d74857dbb1ff3308f2811673e54d"
default-features = false
features = ["applet", "applet-token", "tokio", "wayland"]
