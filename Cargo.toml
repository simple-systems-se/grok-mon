[package]
name = "cosmic-ext-applet-grok-monitor"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "Unlicense"
description = "COSMIC panel applets that show shared Grok usage per account and xAI API prepaid credit"
repository = "https://github.com/simple-systems-se/grok-mon"
homepage = "https://github.com/simple-systems-se/grok-mon"
readme = "README.md"

[profile.release]
lto = "thin"
opt-level = 3

[dependencies]
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
cipher = "0.4"
data-encoding = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
ron = "0.12"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "b812c77438e7d74857dbb1ff3308f2811673e54d"
default-features = false
features = ["applet", "applet-token", "tokio", "wayland"]
