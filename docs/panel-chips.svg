<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of Grok Monitor panel chips</title>
  <desc id="desc">Sample panel layout with two account chips. The percents are not a live reading.</desc>
  <rect width="760" height="200" fill="#141416"/>
  <text x="24" y="32" fill="#a1a1aa" font-family="sans-serif" font-size="14">Illustration — sample layout, not a live reading</text>
  <rect x="24" y="52" width="712" height="88" rx="18" fill="#2b2b30"/>
  <text x="48" y="78" fill="#8e8e96" font-family="sans-serif" font-size="12">COSMIC panel</text>

  <g transform="translate(48,96)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#3a3a40" stroke-width="3"/>
    <circle cx="16" cy="16" r="14" fill="none" stroke="#2eb852" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 66" transform="rotate(-90 16 16)"/>
    <circle cx="16" cy="16" r="10" fill="#1c1c1e"/>
    <path d="M12.2 22 L16.2 14.4 M13.6 12.4 L18 14.8 L16.8 16.8 L12.4 14.4 Z" fill="none" stroke="#2eb852" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="88" y="108" fill="#2eb852" font-family="sans-serif" font-size="16" font-weight="600">24%</text>
  <text x="88" y="128" fill="#d4d4d8" font-family="sans-serif" font-size="13">Grok (sim sys)</text>

  <g transform="translate(280,96)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#3a3a40" stroke-width="3"/>
    <circle cx="16" cy="16" r="14" fill="none" stroke="#f2d11f" stroke-width="3" stroke-linecap="round" stroke-dasharray="54 34" transform="rotate(-90 16 16)"/>
    <circle cx="16" cy="16" r="10" fill="#1c1c1e"/>
    <path d="M12.2 22 L16.2 14.4 M13.6 12.4 L18 14.8 L16.8 16.8 L12.4 14.4 Z" fill="none" stroke="#f2d11f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="320" y="108" fill="#f2d11f" font-family="sans-serif" font-size="16" font-weight="600">61%</text>
  <text x="320" y="128" fill="#d4d4d8" font-family="sans-serif" font-size="13">Grok (pers)</text>

  <text x="24" y="172" fill="#8e8e96" font-family="sans-serif" font-size="13">One hammer chip per configured account, in the order of the accounts list. Build and Bot share that percent.</text>
  <text x="24" y="190" fill="#8e8e96" font-family="sans-serif" font-size="13">Defaults: Grok (sim sys) → ~/.grok, then Grok (pers) → ~/.grok-personal.</text>
</svg>
