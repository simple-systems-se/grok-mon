<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of the Grok Monitor popup</title>
  <desc id="desc">Sample popup with a usage bar labeled 72% remaining and a time bar labeled 3h 12m. Not a live reading. Sign-in replaces these bars when the icon has no session.</desc>
  <rect width="440" height="280" fill="#141416"/>
  <text x="24" y="28" fill="#a1a1aa" font-family="sans-serif" font-size="13">Illustration — sample popup, not a live reading</text>
  <rect x="24" y="44" width="392" height="168" rx="16" fill="#1c1c1e" stroke="#3a3a40"/>

  <rect x="44" y="78" width="220" height="10" rx="5" fill="#3a3a40"/>
  <rect x="44" y="78" width="158" height="10" rx="5" fill="#3d9a45"/>
  <text x="276" y="88" fill="#f4f4f5" font-family="sans-serif" font-size="14">72% remaining</text>

  <rect x="44" y="118" width="220" height="10" rx="5" fill="#3a3a40"/>
  <rect x="44" y="118" width="96" height="10" rx="5" fill="#d4d4d8"/>
  <text x="276" y="128" fill="#f4f4f5" font-family="sans-serif" font-size="14">3h 12m</text>

  <text x="44" y="168" fill="#8e8e96" font-family="sans-serif" font-size="12">Sample copy. Sign in replaces these bars when</text>
  <text x="44" y="186" fill="#8e8e96" font-family="sans-serif" font-size="12">the icon has no session.</text>
</svg>
